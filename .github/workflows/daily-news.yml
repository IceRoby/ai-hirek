name: Reggeli AI Hírek

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: pip install anthropic

      - name: Hírek összegyűjtése és oldal generálása
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_news.py

      - name: Változások commitolása és feltöltése
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI Hírek Bot"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "🤖 AI hírek frissítve - $(date +'%Y.%m.%d')"
          git pull --rebase origin main
          git push
