# ================================================================
# AI HÍREK - GITHUB ACTIONS WORKFLOW (daily-news.yml)
# ================================================================
# Az ütemezést és a környezeti változókat (Secrets) itt állítod be.
# ================================================================

name: Reggeli AI Hírek

on:
  # HETENTE EGYSZER - hétfőn reggel 6:00 (Budapest téli idő) - AKTÍV
  schedule:
    - cron: '0 5 * * 1'

  # NAPONTA EGYSZER - reggel 6:00
  #schedule:
  #  - cron: '0 5 * * *'

  # NAPONTA KÉTSZER - reggel 6:00 és este 18:00
  #schedule:
  #  - cron: '0 5 * * *'
  #  - cron: '0 17 * * *'

  # CSAK HÉTKÖZNAPOKON - hétfőtől péntekig reggel 6:00
  #schedule:
  #  - cron: '0 5 * * 1-5'

  # KÉTNAPONTA
  #schedule:
  #  - cron: '0 5 */2 * *'

  # ÓRÁNKÉNT
  #schedule:
  #  - cron: '0 * * * *'

  # Manuális indítás - MINDIG hagyd aktívan!
  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: pip install anthropic

      - name: Hírek összegyűjtése és oldal generálása
        env:
          # -------------------------------------------------------
          # KÖTELEZŐ SECRET:
          # Settings → Secrets → Actions → New repository secret
          # -------------------------------------------------------
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # -------------------------------------------------------
          # ALTERNATÍV AI MODELLEK (opcionális):
          # Ha OpenAI vagy Google modellt választasz a config.txt-ben,
          # add hozzá a megfelelő API kulcsot GitHub Secrets-hez.
          # -------------------------------------------------------
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}

          # -------------------------------------------------------
          # KÉP API KULCSOK (opcionális, de ajánlott WP-hez):
          # Pexels:   https://www.pexels.com/api/ (ingyenes)
          # Unsplash: https://unsplash.com/developers (ingyenes)
          # -------------------------------------------------------
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}

          # -------------------------------------------------------
          # WORDPRESS APP PASSWORDÖK (opcionális):
          # Minden WP oldalhoz külön Secret kell.
          # Létrehozás: WP Admin → Felhasználók → Profil →
          #             Application Passwords → Add New
          # -------------------------------------------------------
          WP1_APP_PASSWORD: ${{ secrets.WP1_APP_PASSWORD }}
          WP2_APP_PASSWORD: ${{ secrets.WP2_APP_PASSWORD }}
          WP3_APP_PASSWORD: ${{ secrets.WP3_APP_PASSWORD }}

        run: python fetch_news.py

      - name: Változások commitolása és feltöltése
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI Hírek Bot"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "🤖 AI hírek frissítve - $(date +'%Y.%m.%d %H:%M')"
          git fetch origin main
          git rebase origin/main
          git push origin main
