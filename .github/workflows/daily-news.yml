name: Reggeli AI Hírek

on:
  schedule:
    - cron: '0 5 * * 1'

  # --- NAPONTA EGYSZER ---
  #schedule:
  #  - cron: '0 5 * * *'

  # --- NAPONTA KÉTSZER ---
  #schedule:
  #  - cron: '0 5 * * *'
  #  - cron: '0 17 * * *'

  # --- CSAK HÉTKÖZNAPOKON ---
  #schedule:
  #  - cron: '0 5 * * 1-5'

  # --- KÉTNAPONTA ---
  #schedule:
  #  - cron: '0 5 */2 * *'

  # --- ÓRÁNKÉNT ---
  #schedule:
  #  - cron: '0 * * * *'

  # --- MINDEN 6 ÓRÁBAN ---
  #schedule:
  #  - cron: '0 */6 * * *'

  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: pip install anthropic

      - name: Hírek összegyűjtése és oldal generálása
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_news.py

      - name: Változások commitolása és feltöltése
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AI Hírek Bot"
          git add -A
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "🤖 AI hírek frissítve - $(date +'%Y.%m.%d %H:%M')"
          git fetch origin main
          git rebase origin/main
          git push origin main
